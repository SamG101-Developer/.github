- name: bug
  color: "d93f0b"
  description: Something isn't working

- name: enhancement
  color: "09ed2e"
  description: New feature or request

- name: meta
  color: "ff0088"
  description: Repository or project-level concern

- name: refactor
  color: "fbca04"
  description: Refactoring code (no functional changes, no API changes)

- name: performance
  color: "9002f5"
  description: Improving performance in either c++ or s++ generated code

- name: documentation
  color: "0075ca"
  description: Improvements or additions to documentation

- name: test
  color: "f59c02"
  description: Improvements or additions to tests

- name: ci
  color: "b0f502"
  description: Improvements or additions to CI/CD

- name: todo
  color: "1d76db"
  description: Incomplete ticket (initial plan, needs more work, etc.)

- name: crash
  color: "f50202"
  description: Compiler crash, segfault, GCC/Clang ICE

- name: soundness
  color: "02f590"
  description: Accepts code it shouldn't, or incorrect code generated

- name: breaking
  color: "ff00ff"
  description: Breaking change (S++ code, or the STD)

- name: cross-repo
  color: "ffff00"
  description: Cross-repo issue (requires changes in another repo)

- name: platform
  color: "00ffff"
  description: Platform-specific issue (Windows, Linux, etc.)

- name: third-party
  color: "0000ff"
  description: Integrate or remove a third-party library

- name: security
  color: "010101"
  description: Security issue (e.g. general hardening, buffer overflow, etc.)

- name: dependencies
  color: "3b8227"
  description: Dependency update
